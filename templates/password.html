{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="narrow"><div class="card pad">
  <h1 style="font-size:1.6rem">Change password</h1>
  <form class="stack mt-6" method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="field"><span class="label">Current password</span><input class="input" type="password" name="current" required></label>
    <label class="field"><span class="label">New password (min 8)</span><input class="input" type="password" name="new" minlength="8" required></label>
    <label class="field"><span class="label">Confirm new password</span><input class="input" type="password" name="new2" minlength="8" required></label>
    {% if error %}<p class="small red">{{ error }}</p>{% endif %}
    <button class="btn">Save password</button>
  </form>
</div></div>
{% endblock %}
